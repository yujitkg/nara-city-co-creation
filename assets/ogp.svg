<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">奈良市共創チーム</title>
  <desc id="desc">奈良の未来を、共に創る。白基調に金系アクセントを添えた奈良市共創チームのOGP画像。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.64" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f5f2"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9f7" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8c6a2e" stroke-width="1" opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="52" y="52" width="1096" height="526" rx="36" fill="url(#warm)" stroke="#ebe7df" stroke-width="1"/>
  <rect x="52" y="52" width="1096" height="526" rx="36" fill="url(#grid)"/>
  <path d="M800 118c108 40 186 146 186 270 0 58-17 112-46 157" fill="none" stroke="#b89b5e" stroke-width="1.6" opacity="0.26"/>
  <path d="M704 432c118-86 262-102 386-47" fill="none" stroke="#8c6a2e" stroke-width="1.2" opacity="0.18"/>
  <path d="M134 450c169-96 353-96 548 0" fill="none" stroke="#8c6a2e" stroke-width="1.5" opacity="0.26"/>
  <circle cx="184" cy="438" r="5.5" fill="#8c6a2e" opacity="0.34"/>
  <circle cx="416" cy="398" r="5.5" fill="#b89b5e" opacity="0.42"/>
  <circle cx="666" cy="450" r="5.5" fill="#8c6a2e" opacity="0.32"/>
  <g transform="translate(108 102)">
    <rect x="0" y="0" width="22" height="22" fill="none" stroke="#b89b5e" stroke-width="1.5" transform="rotate(45 11 11)"/>
    <text x="42" y="18" fill="#8c6a2e" font-family="Hiragino Sans, Yu Gothic, YuGothic, sans-serif" font-size="18" font-weight="700" letter-spacing="3">NARA CITY CO-CREATION TEAM</text>
  </g>
  <text x="108" y="286" fill="#1f1f1f" font-family="Hiragino Mincho ProN, Yu Mincho, YuMincho, serif" font-size="74" font-weight="500" letter-spacing="0">奈良市共創チーム</text>
  <text x="108" y="378" fill="#1f1f1f" font-family="Hiragino Mincho ProN, Yu Mincho, YuMincho, serif" font-size="52" font-weight="500" letter-spacing="0">奈良の未来を、共に創る。</text>
  <text x="110" y="462" fill="#6b6b6b" font-family="Hiragino Sans, Yu Gothic, YuGothic, sans-serif" font-size="22" letter-spacing="0.6">奈良市みらい価値共創プロジェクト研究から生まれた共創コミュニティ</text>
  <line x1="108" y1="506" x2="420" y2="506" stroke="#b89b5e" stroke-width="1.5" opacity="0.42"/>
